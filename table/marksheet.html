<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark Sheet</title>
  </head>
  <body>
    <h2 style="color: red; text-align: center">St. Mary's High School</h2>

    <table cellspacing="0" cellpading="0" border="1" width="600">
      <tr>
        <th>Subject</th>
        <th>
          Total Marks
          <table cellspacing="0" cellpadding="0" border="1" width="100">
            <tr>
              <th>Theory</th>
              <th>Internals</th>
            </tr>
          </table>
        </th>
        <th>
          Passing Mark

          <table cellspacing="0" cellpadding="0" border="1" width="100">
            <tr>
              <th>Theory</th>
              <th>Internals</th>
            </tr>
          </table>
        </th>
        <th>
          Marks Obtained

          <table cellspacing="0" cellpadding="0" border="1" width="100">
            <tr>
              <th>Theory</th>
              <th>Internals</th>
            </tr>
          </table>
        </th>
        <th>Total Obtained</th>
        <th>Grade</th>
      </tr>

      <tr>
        <td>Mathematics</td>
        <td>100</td>
        <td>40</td>
        <td>85</td>
        <td>85</td>
        <td>A</td>
      </tr>

      <tr>
        <td>English</td>
        <td>100</td>
        <td>40</td>
        <td>78</td>
        <td>163</td>
        <td>A</td>
      </tr>

      <tr>
        <td>Science</td>
        <td>100</td>
        <td>40</td>
        <td>92</td>
        <td>255</td>
        <td>A+</td>
      </tr>

      <tr>
        <td>History</td>
        <td>100</td>
        <td>40</td>
        <td>88</td>
        <td>343</td>
        <td>A</td>
      </tr>
    </table>
  </body>
</html>
